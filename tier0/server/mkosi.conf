[Config]
MinimumVersion=26

[Distribution]
Distribution=fedora
Release=44
Repositories=ultramarine

[Build]
ToolsTree=default
ToolsTreeDistribution=fedora
ToolsTreeRelease=44
History=yes
CacheDirectory=mkosi.cache
SandboxTrees=
    ../../base/repodir/ultramarine.repo:/etc/yum.repos.d/ultramarine.repo

[Validation]
SecureBoot=no
SignExpectedPcr=no

[Content]
# Root filesystem of the image this tier derives from, materialised into place
# by scripts/mkosi-basetree.sh.
BaseTrees=basetree
# Keep /usr/lib/sysimage/rpm so dnf can resolve what is already installed and so
# this image can itself be used as the base tree of the next tier.
CleanPackageMetadata=no
Bootable=no
KernelCommandLine=
RemoveFiles=
    /usr/etc
    /var/
    /boot/*
Packages=
    moby-engine
    docker-compose
    podman
    container-selinux
    tuned-ppd
    powertop
    btop
    tetra
    tuned-profiles-atomic
    tuned-profiles-cpu-partitioning
    tuned-profiles-realtime
    cockpit
    cockpit-ws-selinux
    cockpit-podman
    cockpit-ostree
    cockpit-networkmanager
    cockpit-storaged
    tailscale
    cloud-init
    podlet

[Output]
ImageId=Ultramarine Linux
OutputDirectory=mkosi.output
ManifestFormat=json
Output=%i_%a
OciLabels=
    containers.bootc=1
    bootc.diskimage-builder=quay.io/centos-bootc/bootc-image-builder
Format=oci
