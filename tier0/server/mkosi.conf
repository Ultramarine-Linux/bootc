[Include]
Include=../../common/mkosi.conf.d/10-distribution.conf
Include=../../common/mkosi.conf.d/20-build.conf
Include=../../common/mkosi.conf.d/30-output.conf

[Build]
SandboxTrees=
    ../../base/repodir/ultramarine.repo:/etc/yum.repos.d/ultramarine.repo
    ../../common/dnf/dnf.conf:/etc/dnf/dnf.conf

[Content]
# Root filesystem of the image this tier derives from, materialised into place
# by scripts/mkosi-basetree.sh.
BaseTrees=basetree
RemoveFiles=
    /usr/etc
    /var/
    /boot/*
Packages=
    moby-engine
    docker-compose
    podman
    container-selinux
    tuned-ppd
    powertop
    btop
    tetra
    tuned-profiles-atomic
    tuned-profiles-cpu-partitioning
    tuned-profiles-realtime
    cockpit
    cockpit-ws-selinux
    cockpit-podman
    cockpit-ostree
    cockpit-networkmanager
    cockpit-storaged
    tailscale
    cloud-init
    podlet
