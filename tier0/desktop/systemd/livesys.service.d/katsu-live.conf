# Run the livesys live-image setup on Katsu live media.
#
# The packaged unit gates on `ConditionKernelCommandLine=rd.live.image`, and a
# Katsu composefs ISO does not carry that: its root is selected by
# `rd.katsu.composefs` plus `composefs=<digest>` instead. Without this, livesys
# silently does nothing on our media, so there is no liveuser, no
# `/.liveimg-configured`, and none of the live tuning (disabled cron/abrt,
# hostname, autologin) ever runs.
#
# Conditions are ANDed, so the packaged line has to be reset and re-added as a
# *triggering* condition (`|`), which makes the whole set OR. That accepts either
# marker rather than requiring both.
[Unit]
ConditionKernelCommandLine=
ConditionKernelCommandLine=|rd.live.image
ConditionKernelCommandLine=|rd.katsu.composefs
