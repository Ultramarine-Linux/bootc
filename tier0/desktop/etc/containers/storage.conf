# Container storage for bootc deployments built from this image.
#
# A bootc composefs deployment keeps its image store under
# `/usr/lib/bootc/storage`, which on a booted system is a symlink into
# `/sysroot/ostree/bootc/storage`. Merging it in is what lets the live image
# install itself offline: `bootc install` copies the image from that store rather
# than pulling it from a registry.
#
# This has to live in the full `/etc/containers/storage.conf`, not a
# `storage.conf.d` drop-in: `additionalimagestores` is not honoured from drop-ins.
#
# The native overlay driver is deliberately left unconfigured here. It works on a
# normal installation, and forcing `mount_program` would silently trade it for
# fuse-overlayfs everywhere. Live media, where the read-only payload does need the
# fallback, sets it in its own drop-in instead.
[storage]
driver = "overlay"

# Read-only stores merged on top of the writable graphroot. The bootc-owned store
# is what makes an offline install possible.
additionalimagestores = [
    "/usr/lib/bootc/storage",
]

[storage.options.pull_options]
# Partial pulls leave layer data in the source store; the live media needs a
# self-contained image so an offline install has every layer locally.
enable_partial_images = "false"