[Config]
MinimumVersion=26

[Distribution]
Distribution=fedora
Release=44
Repositories=ultramarine

[Build]
ToolsTree=default
ToolsTreeDistribution=fedora
ToolsTreeRelease=44
History=yes
CacheDirectory=mkosi.cache
SandboxTrees=
    ../../base/repodir/ultramarine.repo:/etc/yum.repos.d/ultramarine.repo

[Validation]
SecureBoot=no
SignExpectedPcr=no

[Content]
# Root filesystem of the image this tier derives from, materialised into place
# by scripts/mkosi-basetree.sh.
BaseTrees=basetree
# Keep /usr/lib/sysimage/rpm so dnf can resolve what is already installed and so
# this image can itself be used as the base tree of the next tier.
CleanPackageMetadata=no
Bootable=no
KernelCommandLine=
# No RemoveFiles: live-setup.sh deliberately populates /var (livesys hooks,
# prebuilt man cache, /var/.updated), which the Containerfile preserved.
Packages=
    taidan
    mesa-dri-drivers
    mesa-filesystem
    mesa-libGL
    mesa-libgbm
    mesa-vulkan-drivers
    readymade
    readymade-config-ultramarine
    @multimedia
    ffmpeg
    mozilla-openh264
    @ultramarine-product-common
    plymouth
    livesys-scripts
    isomd5sum
    orca
    espeak-ng
    speech-dispatcher-espeak-ng
    mkfstab
    um
    8bitdo-udev-rules
    udev-joystick-blacklist
    android-udev-rules
    moby-engine
    docker-compose
    podman
    container-selinux
    dive
    dracut-live
    dracut-network
    distrobox
    ultramarine-repos-extras
    dracut-strip-trigger
    PackageKit
    fuse-libs
    tuned-ppd
    powertop
    tuned-profiles-atomic
    plymouth-system-theme
    @base-graphical

[Output]
ImageId=Ultramarine Linux
OutputDirectory=mkosi.output
ManifestFormat=json
Output=%i_%a
OciLabels=
    containers.bootc=1
    bootc.diskimage-builder=quay.io/centos-bootc/bootc-image-builder
Format=oci
