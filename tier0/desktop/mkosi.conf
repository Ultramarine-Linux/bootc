[Include]
Include=../../common/mkosi.conf.d/10-distribution.conf
Include=../../common/mkosi.conf.d/20-build.conf
Include=../../common/mkosi.conf.d/30-output.conf

[Build]
SandboxTrees=
    ../../base/repodir/ultramarine.repo:/etc/yum.repos.d/ultramarine.repo

[Content]
# Root filesystem of the image this tier derives from, materialised into place
# by scripts/mkosi-basetree.sh.
BaseTrees=basetree
# No RemoveFiles: live-setup.sh deliberately populates /var (livesys hooks,
# prebuilt man cache, /var/.updated), which the Containerfile preserved.
Packages=
    taidan
    mesa-dri-drivers
    mesa-filesystem
    mesa-libGL
    mesa-libgbm
    mesa-vulkan-drivers
    readymade
    readymade-config-ultramarine
    @multimedia
    ffmpeg
    mozilla-openh264
    @ultramarine-product-common
    plymouth
    livesys-scripts
    isomd5sum
    orca
    espeak-ng
    speech-dispatcher-espeak-ng
    mkfstab
    um
    8bitdo-udev-rules
    udev-joystick-blacklist
    android-udev-rules
    moby-engine
    docker-compose
    podman
    container-selinux
    dive
    dracut-live
    dracut-network
    distrobox
    ultramarine-repos-extras
    dracut-strip-trigger
    PackageKit
    fuse-libs
    tuned-ppd
    powertop
    tuned-profiles-atomic
    plymouth-system-theme
    @base-graphical
