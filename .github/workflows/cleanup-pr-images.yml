name: Clean up PR images

on:
  pull_request:
    types: [closed]

permissions:
  packages: write

jobs:
  cleanup:
    name: Delete staging images for PR ${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete PR-tagged image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          packages=(
            base-bootc
            desktop-bootc
            server-bootc
            gnome-bootc
            xfce-bootc
            plasma-bootc
          )

          for package in "${packages[@]}"; do
            echo "Checking ghcr.io/${OWNER}/${package}"
            # A version can carry several tags (e.g. pr-N and pr-N-<sha>[-suffix]),
            # so check all of them. Only delete versions whose
            # tags all belong to this PR, never one that also carries a release tag.
            gh api --paginate \
              "/orgs/${OWNER}/packages/container/${package}/versions?per_page=100" \
              --jq ".[] | (.metadata.container.tags // []) as \$t | select((\$t | length) > 0 and all(\$t[]; . == \"pr-${PR_NUMBER}\" or startswith(\"pr-${PR_NUMBER}-\"))) | [.id, (\$t | join(\",\"))] | @tsv" |
            while IFS=$'\t' read -r version_id tags; do
              echo "Deleting ${package} version ${version_id} (${tags})"
              gh api --method DELETE \
                "/orgs/${OWNER}/packages/container/${package}/versions/${version_id}"
            done
          done
