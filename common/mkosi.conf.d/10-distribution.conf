# Settings shared by every tier.
#
# Included from each tier's mkosi.conf via [Include]. Note that relative paths
# inside an included file resolve against the directory of the file that
# includes it, so the paths below are written relative to a tier directory
# (../../common/...).

[Config]
MinimumVersion=26

[Distribution]
Distribution=fedora
Release=44
Repositories=ultramarine

[Validation]
SecureBoot=no
SignExpectedPcr=no

[Content]
CleanPackageMetadata=no
Bootable=no
KernelCommandLine=
