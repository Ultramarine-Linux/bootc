[main]
# Shared dnf configuration for the package-manager sandbox, mounted in by each
# tier's SandboxTrees.
#
# dnf5 has no include= mechanism, so a tier that needs an exclude cannot layer
# a drop-in on top of this file: it has to ship a complete dnf.conf of its own
# under mkosi.sandbox/ and repeat the filelists setting below. Verified that
# an exclude= reached via include= is silently ignored by dnf5.
optional_metadata_types=filelists
