[Config]
MinimumVersion=26

[Distribution]
Distribution=fedora
Release=44
Repositories=ultramarine

[Build]
ToolsTree=default
ToolsTreeDistribution=fedora
ToolsTreeRelease=44
History=yes
CacheDirectory=mkosi.cache
SandboxTrees=
    ../../base/repodir/ultramarine.repo:/etc/yum.repos.d/ultramarine.repo

[Validation]
SecureBoot=no
SignExpectedPcr=no

[Content]
# Root filesystem of the image this tier derives from, materialised into place
# by scripts/mkosi-basetree.sh.
BaseTrees=basetree
CleanPackageMetadata=no
Bootable=no
KernelCommandLine=
WithRecommends=no
Packages=
    ultramarine-release-identity-plasma
    plasma-discover-flatpak
    plasma-discover-rpm-ostree
    plasma-discover-packagekit
    @ultramarine-plasma-product-environment
    @ultramarine-plasma-no-flatpak-apps
    plasma-milou

[Output]
ImageId=Ultramarine Linux
OutputDirectory=mkosi.output
ManifestFormat=json
Output=%i_%a
OciLabels=
    containers.bootc=1
    bootc.diskimage-builder=quay.io/centos-bootc/bootc-image-builder
    # Quoted because OciLabels splits on unquoted spaces.
    readymade.prettyname="Ultramarine Plasma Edition"
Format=oci
