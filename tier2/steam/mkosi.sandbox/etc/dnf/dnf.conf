[main]
# mkosi only synthesises this file when the sandbox tree does not already
# provide one, so the filelists line it would have written has to be repeated
# here or dependency resolution can silently lose information.
optional_metadata_types=filelists
# ExTest is a shim for the XTest extension that other desktops need because
# they work poorly with the Remote Desktop portal; GNOME is not one of them.
exclude=extest*
