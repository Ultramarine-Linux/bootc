[Config]
MinimumVersion=26

[Distribution]
Distribution=fedora
Release=44
Repositories=ultramarine

[Build]
ToolsTree=default
ToolsTreeDistribution=fedora
ToolsTreeRelease=44
History=yes
CacheDirectory=mkosi.cache
SandboxTrees=
    ../../base/repodir/ultramarine.repo:/etc/yum.repos.d/ultramarine.repo

[Validation]
SecureBoot=no
SignExpectedPcr=no

[Content]
# Root filesystem of the image this tier derives from, materialised into place
# by scripts/mkosi-basetree.sh.
BaseTrees=basetree
CleanPackageMetadata=no
Bootable=no
KernelCommandLine=
Packages=
    steam
    glibc.i686
    mesa-dri-drivers.i686
    mesa-libGL.i686
    mesa-libEGL.i686
    mesa-vulkan-drivers.i686
    vulkan-loader.i686
    udev-joystick-blacklist-rm
    steam-devices
    steam-notif-daemon
    terra-gamescope
    gamescope-session-steam
    gamemode
    lutris
    scx-scheds
    scx-tools
    mangohud
    terra-protontricks
    gamescope-session-plus

[Output]
ImageId=Ultramarine Linux
OutputDirectory=mkosi.output
ManifestFormat=json
Output=%i_%a
OciLabels=
    containers.bootc=1
    bootc.diskimage-builder=quay.io/centos-bootc/bootc-image-builder
Format=oci
