[Include]
Include=../../common/mkosi.conf.d/10-distribution.conf
Include=../../common/mkosi.conf.d/20-build.conf
Include=../../common/mkosi.conf.d/30-output.conf

[Build]
SandboxTrees=
    ../../base/repodir/ultramarine.repo:/etc/yum.repos.d/ultramarine.repo

[Content]
# Root filesystem of the image this tier derives from, materialised into place
# by scripts/mkosi-basetree.sh.
BaseTrees=basetree
Packages=
    steam
    glibc.i686
    mesa-dri-drivers.i686
    mesa-libGL.i686
    mesa-libEGL.i686
    mesa-vulkan-drivers.i686
    vulkan-loader.i686
    udev-joystick-blacklist-rm
    steam-devices
    steam-notif-daemon
    terra-gamescope
    gamescope-session-steam
    gamemode
    lutris
    scx-scheds
    scx-tools
    mangohud
    terra-protontricks
    gamescope-session-plus
