[Include]
Include=../../common/mkosi.conf.d/10-distribution.conf
Include=../../common/mkosi.conf.d/20-build.conf
Include=../../common/mkosi.conf.d/30-output.conf

[Build]
# nvidia.sh fetches the NVIDIA SELinux policy and builds kernel modules, both
# of which need the network.
WithNetwork=yes
SandboxTrees=
    ../../base/repodir/ultramarine.repo:/etc/yum.repos.d/ultramarine.repo
    ../../base/repodir/terra.repo:/etc/yum.repos.d/terra.repo
    ../../base/repodir/terra-extras.repo:/etc/yum.repos.d/terra-extras.repo
    ../../base/repodir/terra-mesa.repo:/etc/yum.repos.d/terra-mesa.repo
    ../../common/dnf/dnf.conf:/etc/dnf/dnf.conf

[Content]
# Root filesystem of the image this tier derives from, materialised into place
# by scripts/mkosi-basetree.sh.
BaseTrees=basetree
Packages=
    terra-release-nvidia
    gcc-c++

[Output]
# Quoted because OciLabels splits on unquoted spaces.
OciLabels=
    readymade.prettyname_suffix=" (with NVIDIA Drivers)"
